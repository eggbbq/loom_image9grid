[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-image9grid"
version = "1.1.0"
description = "Standalone PNG nine-slice optimizer with LayaAir project integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10.3,<14"]

[project.urls]
Repository = "https://github.com/eggbbq/loom_image9grid"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
ninegrid = "ninegrid.__main__:main"
ninegrid-run = "ninegrid.run_9grid:main"
ninegrid-auto = "ninegrid.automatic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ninegrid*"]
namespaces = false

[tool.setuptools.package-data]
ninegrid = ["engine_probe.mjs", "laya/*.mjs", "requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
